<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080e1e" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="cyberGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <radialGradient id="orbGlow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="orbGlow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6" />
      <circle cx="40" cy="40" r="1" fill="#334155" />
    </pattern>

    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.55; }
    }
    @keyframes scanline {
      0% { transform: translateY(-50px); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(420px); opacity: 0; }
    }
    @keyframes dataPulse {
      0%, 100% { stroke-dashoffset: 0; opacity: 0.3; }
      50% { stroke-dashoffset: 60; opacity: 0.8; }
    }
    @keyframes blinkBadge {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.4; }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite alternate; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite alternate-reverse; }
    .scan-beam { animation: scanline 5s linear infinite; }
    .data-wire { stroke-dasharray: 8 6; animation: dataPulse 4s linear infinite; }
    .status-dot { animation: blinkBadge 2s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Animated Glowing Orbs (Background depth) -->
  <circle class="orb-1" cx="240" cy="140" r="220" fill="url(#orbGlow1)" />
  <circle class="orb-2" cx="960" cy="260" r="260" fill="url(#orbGlow2)" />

  <!-- Dynamic Cyber Lines (Subtle in Background) -->
  <g opacity="0.35">
    <path class="data-wire" d="M 0 80 Q 300 120 600 70 T 1200 90" fill="none" stroke="#3b82f6" stroke-width="1.5" />
    <path class="data-wire" d="M 0 320 Q 350 280 700 330 T 1200 310" fill="none" stroke="#8b5cf6" stroke-width="1.5" />
    <path class="data-wire" d="M 150 0 L 150 400" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.2" />
    <path class="data-wire" d="M 1050 0 L 1050 400" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.2" />
  </g>

  <!-- Moving Scanning Beam across background -->
  <line class="scan-beam" x1="50" y1="0" x2="1150" y2="0" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" filter="url(#glow)" />

  <!-- Foreground Pill / Status Badge -->
  <g transform="translate(425, 55)">
    <rect x="0" y="0" width="350" height="34" rx="17" fill="#0f172a" stroke="#1e293b" stroke-width="1.2" />
    <circle class="status-dot" cx="22" cy="17" r="5" fill="#10b981" filter="url(#glow)" />
    <text x="38" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.2">
      AUDIT TRAILS • SIEM • GRC COMPLIANCE
    </text>
  </g>

  <!-- Main Title (Strictly Foreground) -->
  <text x="600" y="150" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="url(#primaryTextGrad)" letter-spacing="-0.5" filter="url(#glow)">
    Audit Logging &amp; Administrative Compliance
  </text>

  <!-- Subtitle -->
  <text x="600" y="200" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
    Enterprise SIEM • Immutable Audit Trails • Continuous Monitoring • GRC Governance
  </text>

  <!-- Floating Feature Badges / Cards (Lower Foreground) -->
  <g transform="translate(180, 260)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="48" rx="10" fill="#0b1329" stroke="#1e3a8a" stroke-width="1.2" opacity="0.9" />
      <text x="20" y="29" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🛡️ SIEM &amp; SOC Ops</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(210, 0)">
      <rect width="200" height="48" rx="10" fill="#0b1329" stroke="#4c1d95" stroke-width="1.2" opacity="0.9" />
      <text x="20" y="29" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📋 Regulatory Trails</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(440, 0)">
      <rect width="190" height="48" rx="10" fill="#0b1329" stroke="#065f46" stroke-width="1.2" opacity="0.9" />
      <text x="20" y="29" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ Open Source Tools</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(660, 0)">
      <rect width="180" height="48" rx="10" fill="#0b1329" stroke="#9a3412" stroke-width="1.2" opacity="0.9" />
      <text x="20" y="29" fill="#fb923c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📊 Benchmarked Tiers</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="200" y1="360" x2="1000" y2="360" stroke="url(#primaryTextGrad)" stroke-width="1.5" stroke-opacity="0.5" />
</svg>
